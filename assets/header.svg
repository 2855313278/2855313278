<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">2855313278 — Build. Learn. Repeat.</title>
  <desc id="desc">A dark green personal GitHub banner with mint typography and an abstract orbital diagram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081713"/><stop offset="1" stop-color="#0c2420"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8cf3bd" stop-opacity=".16"/><stop offset="1" stop-color="#8cf3bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8cf3bd" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
