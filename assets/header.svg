    <text x="56" y="129" fill="#9bb7ab" font-size="16" letter-spacing="3">HELLO, I'M</text>
    <text x="52" y="207" fill="#f1f8f4" font-size="76" font-weight="750" letter-spacing="-3">2855313278<tspan fill="#8cf3bd">.</tspan></text>
    <text x="56" y="263" fill="#8cf3bd" font-size="28" font-weight="500" letter-spacing=".5">Build. Learn. Repeat.</text>
    <text x="57" y="305" fill="#9bb7ab" font-size="16" font-family="'Microsoft YaHei', 'Segoe UI', sans-serif">从一个想法开始，让每一次实践都有迹可循。</text>
